<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrawSync • Multiplayer Drawing Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Join Screen -->
  <div id="join-screen" class="screen active">
    <!-- Skribbl Header & Logo -->
    <div class="skribbl-header">
      <div class="skribbl-logo">
        <span class="logo-char letter-s">s</span><span class="logo-char letter-k">k</span><span class="logo-char letter-r">r</span><span class="logo-char letter-i">i</span><span class="logo-char letter-b1">b</span><span class="logo-char letter-b2">b</span><span class="logo-char letter-l">l</span><span class="logo-char letter-dot">.</span><span class="logo-char letter-io">io</span><span class="logo-char letter-ex">!</span>
        <div class="skribbl-pencil">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 35 L12 33 L32 13 L27 8 L7 28 Z" fill="#FFA500" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M5 35 L9 31 L6 31 Z" fill="#FFE4B5" stroke="#000" stroke-width="1.5"/>
            <path d="M5 35 L7 33 L6 34 Z" fill="#000"/>
            <path d="M27 8 L32 13 L36 9 L31 4 Z" fill="#FF69B4" stroke="#000" stroke-width="2.5"/>
            <line x1="12" y1="33" x2="32" y2="13" stroke="#D97706" stroke-width="2"/>
            <line x1="9" y1="26" x2="29" y2="6" stroke="#D97706" stroke-width="1.5"/>
          </svg>
        </div>
      </div>
      <!-- Line of 8 cartoon avatars from screenshot -->
      <div class="skribbl-avatar-banner">
        <div class="mini-avatar avatar-red"></div>
        <div class="mini-avatar avatar-orange"></div>
        <div class="mini-avatar avatar-yellow"></div>
        <div class="mini-avatar avatar-green"></div>
        <div class="mini-avatar avatar-cyan"></div>
        <div class="mini-avatar avatar-blue crown"></div>
        <div class="mini-avatar avatar-purple"></div>
        <div class="mini-avatar avatar-pink"></div>
      </div>
    </div>

    <!-- Main Skribbl Card Container -->
    <div class="skribbl-card">
      <form id="join-form">
        <!-- Top Row: Name Input & Language Select -->
        <div class="skribbl-row-top">
          <input 
            type="text" 
            id="player-name" 
            placeholder="Enter your name" 
            maxlength="15" 
            required
            autocomplete="off"
            value="hi"
          >
          <select id="language-select" class="skribbl-select">
            <option value="en" selected>English</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="it">Italian</option>
          </select>
        </div>

        <!-- Room Code Input -->
        <div class="skribbl-row-code">
          <input 
            type="text" 
            id="room-code" 
            placeholder="Room Code (Leave blank for random)" 
            maxlength="6" 
            autocomplete="off"
            style="text-transform: uppercase;"
          >
        </div>

        <!-- Avatar Customizer Box -->
        <div class="avatar-customizer-box">
          <!-- Left Arrow Buttons (Color, Eyes, Mouth) -->
          <div class="arrow-column left-arrows">
            <button type="button" class="arrow-btn" id="arrow-color-left" title="Previous Color">&lt;</button>
            <button type="button" class="arrow-btn" id="arrow-eyes-left" title="Previous Eyes">&lt;</button>
            <button type="button" class="arrow-btn" id="arrow-mouth-left" title="Previous Mouth">&lt;</button>
          </div>

          <!-- Central Character Canvas / SVG Preview -->
          <div class="avatar-display-area">
            <div id="avatar-preview" class="avatar-character">
              <!-- SVG dynamically rendered here -->
            </div>
          </div>

          <!-- Right Arrow Buttons (Color, Eyes, Mouth) -->
          <div class="arrow-column right-arrows">
            <button type="button" class="arrow-btn" id="arrow-color-right" title="Next Color">&gt;</button>
            <button type="button" class="arrow-btn" id="arrow-eyes-right" title="Next Eyes">&gt;</button>
            <button type="button" class="arrow-btn" id="arrow-mouth-right" title="Next Mouth">&gt;</button>
          </div>

          <!-- Randomize Dice Icon Button -->
          <button type="button" id="btn-dice" class="dice-btn" title="Randomize Avatar">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7.5 18c-.83 0-1.5-.67-1.5-1.5S6.67 15 7.5 15s1.5.67 1.5 1.5S8.33 18 7.5 18zm0-9C6.67 9 6 8.33 6 7.5S6.67 6 7.5 6 9 6.67 9 7.5 8.33 9 7.5 9zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm0-9c-.83 0-1.5-.67-1.5-1.5S15.67 6 16.5 6s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
            </svg>
          </button>
        </div>

        <!-- Big Green Play! Button -->
        <button type="submit" id="btn-play" class="btn-skribbl-play">Play!</button>

        <!-- Blue Create Private Room Button -->
        <button type="button" id="btn-create-private" class="btn-skribbl-private">Create Private Room</button>
      </form>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <!-- Header -->
    <header class="game-header">
      <div class="header-left">
        <div class="logo-small">DrawSync</div>
        <div class="player-count">
          <span id="player-count">0</span> online
        </div>
      </div>
      
      <div class="header-center">
        <div id="round-status" class="round-status">Waiting for players...</div>
        <div id="word-display" class="word-display"></div>
      </div>
      
      <div class="header-right">
        <!-- Room Code Display and Copy Link Widget -->
        <div class="room-share-widget" id="room-share-widget">
          Room: <span id="display-room-code">----</span>
          <button id="copy-link-btn" title="Copy Room Link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
          <span class="tooltip" id="copy-tooltip">Copied!</span>
        </div>
        <div id="timer" class="timer">--</div>
      </div>
    </header>

    <!-- Main Game Area -->
    <div class="game-container">
      <!-- Players Scoreboard Sidebar -->
      <div class="scoreboard-section">
        <div class="scoreboard-header">
          <h3>Leaderboard</h3>
        </div>
        <div id="players-list" class="players-list">
          <!-- Dynamic Player cards go here -->
        </div>
      </div>

      <!-- Canvas Section -->
      <div class="canvas-section">
        <div class="canvas-wrapper">
          <canvas id="game-canvas" width="800" height="600"></canvas>
          <div id="canvas-overlay" class="canvas-overlay">Waiting for Players to Join</div>
        </div>
        
        <!-- Drawing Controls -->
        <div id="drawing-controls" class="drawing-controls hidden">
          <div class="control-group">
            <label>Brush Size</label>
            <input type="range" id="brush-size" min="2" max="20" value="4">
            <span id="brush-size-value">4</span>
          </div>
          
          <div class="control-group">
            <label>Color</label>
            <div class="color-palette">
              <button class="color-btn active" data-color="#000000" style="background: #000000;"></button>
              <button class="color-btn" data-color="#FFFFFF" style="background: #FFFFFF;"></button>
              <button class="color-btn" data-color="#FF4444" style="background: #FF4444;"></button>
              <button class="color-btn" data-color="#44FF44" style="background: #44FF44;"></button>
              <button class="color-btn" data-color="#4444FF" style="background: #4444FF;"></button>
              <button class="color-btn" data-color="#FFFF44" style="background: #FFFF44;"></button>
              <button class="color-btn" data-color="#FF44FF" style="background: #FF44FF;"></button>
              <button class="color-btn" data-color="#44FFFF" style="background: #44FFFF;"></button>
            </div>
          </div>
          
          <button id="clear-btn" class="btn-secondary">Clear Canvas</button>
        </div>
      </div>

      <!-- Chat Section -->
      <div class="chat-section">
        <div class="chat-header">
          <h3>Chat & Guesses</h3>
        </div>
        
        <div id="chat-messages" class="chat-messages"></div>
        
        <form id="chat-form" class="chat-input-wrapper">
          <input 
            type="text" 
            id="chat-input" 
            placeholder="Type your guess..." 
            autocomplete="off"
            maxlength="50"
          >
          <button type="submit" class="btn-send">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 8L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
